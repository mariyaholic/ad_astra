# CYGNUS known-object test for TOI-2939.01, generated 2026-10-02 by `python -m cygnus.multi new`.
# Target values are copied from: campaigns/tess-periodic-02/target_queue.csv (rank 148), NASA Exoplanet Archive TOI row refreshed 2026-10-02T07:25:14Z (rowupdate 2024-08-22 10:08:01). Run with
#   python -m cygnus.multi run campaigns/toi-2939-01.yaml
#   python -m cygnus.multi report campaigns/toi-2939-01.yaml
schema: cygnus.campaign/1
runner: cygnus.multi
campaign_id: toi-2939-01
parent: tess-periodic-02
domain: worlds.planetary.transit
objective: >
  Known-object test on TOI-2939.01 (TIC 5485318, PC): check that the calibrated residual screen
  recovers every catalogued transit in its retrieved light curves, measure the depth, then screen the same light curves for further transit-like
  dips outside the catalogued transits. A further dip is an unverified lead until vetted; it does
  not imply a period.
outputs: campaigns/toi-2939-01/
random_seed: 20260927

targets:
  - name: TOI-2939.01
    tic: 5485318
    ra_deg: 149.759485
    dec_deg: -22.94676
    frame: ICRS
    epoch: J2015.5
    position_source: NASA Exoplanet Archive TOI table (Gaia DR2 epoch J2015.5, verified reports/position-epoch-audit-01)
    t0_bjd: 2459273.922515
    period_days: 4.8306667
    depth_ppm: 9790.0
    duration_h: 4.24
    tmag: 12.6819
    catalogue_row_updated: "2024-08-22 10:08:01"
    catalogue_query: "SELECT toi, tid, tfopwg_disp, ra, dec, st_tmag, pl_trandep, pl_trandurh, pl_tranmid, pl_orbper, sectors, toi_created, rowupdate FROM toi WHERE tid = 5485318"
    catalogue_retrieved_utc: "2026-10-02T07:25:14Z"

# Catalogued transits are excluded from the search for further dips and are the positive control.
veto:
  kind: ephemeris
  period_days: 4.8306667
  t0_bjd: 2459273.922515
  veto_phase: 0.0549
  depth_ppm: 9790.0
  duration_h: 4.24
  source: campaigns/tess-periodic-02/target_queue.csv (rank 148), NASA Exoplanet Archive TOI row refreshed 2026-10-02T07:25:14Z (rowupdate 2024-08-22 10:08:01)

steps:
  - fetch_products:
      from_targets: {max_products_per_target: 6}
  - calibrate_screen:
      declared_k: 5.0
      window_days: 2.0
      k_grid: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 7.0, 8.0, 10.0, 12.0]
      max_null_events: 0
      depths_ppm: [500, 1000, 2000, 5000, 10000, 20000]
      durations_h: [1.0, 2.0, 4.0, 8.0]
      injections_per_cell: 10
      reference_signal: {depth_ppm: 2000, duration_h: 4.0}
  - known_signal_recovery:
      k_mad: calibrated
      epoch_tolerance_hours: 2.0
  - stellar_context:
      radius_arcsec: 63
      aperture_arcsec: 52.5
  - residual_screen:
      windows_days: [1.0, 2.0, 3.0]
      k_mad: calibrated
      min_cadences: 2
      series_window_days: 2.0
  - event_census:
      pad_days: 0.25
      z_max: 5.0
  - period_aliases:
      depth_ratio: [0.5, 2.0]
      min_period_days: 1.0
      min_coverage: 0.5
      excluded_below: 0.3
      duration_frac_err: 0.1
  - moving_objects:
      radius_arcsec: 600
  - fetch_independent: {}
  - alias_cross_instrument: {}
  - variability_guard:
      match_arcsec: 10
  - prior_art:
      radius_arcsec: 30

record:
  path: campaigns/toi-2939-01/sky_record.json
  title: Known-object test, TOI-2939.01
  kind: known-object test
  outcome: pipeline_check
  report: campaigns/toi-2939-01/REPORT.md
  search_log: campaigns/toi-2939-01/SEARCH_LOG.md
  summary: >
    Known-object test on TOI-2939.01: positive control on the catalogued transit(s), calibrated
    screen for further dips, catalogue cross-match.
  checks:
    - {name: "Product integrity (SHA-256)", state: not_tested}
    - {name: "Known-signal recovery (positive control)", state: not_tested}
    - {name: "Calibrated false-alarm threshold (sign-flip null)", state: not_tested}
    - {name: "Synthetic signal injection–recovery", state: not_tested}
    - {name: "Catalogue cross-match", state: not_tested}
    - {name: "Period aliases (repeat events)", state: not_tested}
    - {name: "Alternative detrending", state: not_tested}
    - {name: "Difference-image centroids / blend audit", state: not_tested}
    - {name: "Pointing / jitter correlation", state: not_tested}
    - {name: "Literature (ADS) audit", state: not_tested}
